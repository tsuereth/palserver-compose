version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      all:
        patterns:
          - "*"
    schedule:
      interval: cron
      cronjob: '0 12 * * 5'
  - package-ecosystem: nuget
    directory: "/palserver-container/"
    groups:
      all:
        patterns:
          - "*"
    schedule:
      interval: cron
      cronjob: '0 12 * * 5'
